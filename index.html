<style>

h1{font-size:64px;margin:0;letter-spacing:2px}
button,input{font:inherit;border:0;border-radius:12px;padding:12px 26px;font-weight:700}
button{cursor:pointer;color:#fff;background:#3b82f6;font-size:20px}button:hover{filter:brightness(1.15)}
input{background:#1b2440;color:#fff;text-align:center;width:200px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.pick{width:150px;padding:14px 8px;font-size:18px}.pick small{display:block;font-weight:400;font-size:12px;margin-top:4px}
.dim{opacity:.7;font-size:14px}
#custS.on{flex-direction:row;flex-wrap:wrap;gap:24px 36px}.col{display:flex;flex-direction:column;gap:8px;align-items:center}.col h2{margin:0}
.crow{display:flex;align-items:center;gap:8px;width:290px}.crow span{flex:1;font-weight:700}.crow button{padding:4px 14px;font-size:18px}
#custS .row button{padding:8px 16px;font-size:16px}
#shopS{justify-content:flex-start;overflow:auto;padding:14px 0;gap:8px}#shopS h2,#shopS .dim{margin:0}
#urows{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:8px;width:min(680px,94vw)}
.urow{display:flex;align-items:center;gap:10px;background:#1b2440;border-radius:12px;padding:8px 12px;text-align:left}.urow div{flex:1}.urow small{display:block;opacity:.7;font-size:12px}.urow button{padding:6px 12px;font-size:15px;min-width:74px}
#rows{gap:4px}.crow button{padding:2px 12px;font-size:16px}
#cosS{justify-content:flex-start;overflow:auto;padding:12px 0;gap:8px}#cosS h2,#cosS p{margin:0}
#cosGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;width:min(720px,94vw)}
.cosCard{display:flex;flex-direction:column;align-items:center;gap:4px;background:#1b2440;border-radius:12px;padding:8px;border:2px solid #2a355a}
.cosCard.worn{border-color:#5ae682}.cosCard canvas{width:120px;height:120px;background:#10172e;border-radius:10px}
.cosCard b{font-size:15px}.cosCard small{opacity:.7;font-size:12px}
.cosCard button{padding:6px 10px;font-size:14px;min-width:96px}
.wallet{font-weight:700;color:#5ae682}
@media(max-height:520px){#custS.on{align-items:flex-start;overflow:auto;padding:8px}}
#pauseBtn{position:fixed;top:8px;left:50%;transform:translateX(-50%);padding:4px 14px;font-size:14px;background:#0008;display:none}
#muteBtn{position:fixed;top:8px;right:8px;padding:6px 12px;font-size:16px;background:#0008;z-index:5}
</style></head><body>
<canvas id="c"></canvas>
<button id="pauseBtn">❚❚</button>
<button id="muteBtn" title="Sound">🔊</button>
<div class="scr on" id="menu"><h1>Petri.IO</h1>
 <div class="dim">Type beats type. Size only matters against your own kind.</div>
 <input id="name" maxlength="14" placeholder="Your name">
 <div class="row"><button id="play">PLAY</button><button id="custBtn" style="background:#8b5cf6">CUSTOMIZE</button><button id="shopBtn" style="background:#d97706">UPGRADES</button><button id="cosmBtn" style="background:#c2703a">ACCESSORIES</button></div>
 <div class="dim" id="stats"></div>
 <div class="dim">Mouse/touch-stick or WASD to steer · Space = boost · E/Shift = ability · Esc = pause</div></div>
<div class="scr" id="shopS"><h2>Upgrade Shop</h2><div id="shopInfo" style="font-weight:700;color:#5ae682"></div><div class="dim" id="shopMsg">&nbsp;</div><div id="urows"></div><button id="shopBack">BACK</button></div>
<div class="scr" id="cosS"><h2>Accessories</h2><div class="dim" id="cosInfo"></div><div class="dim" id="cosMsg">&nbsp;</div><div id="cosGrid"></div><button id="cosBack">BACK</button></div>
<div class="scr" id="custS"><canvas id="prev" width="190" height="190" style="position:static;width:190px;height:190px;background:#10172e;border-radius:16px"></canvas><div class="col"><h2>Customize</h2><div id="rows" class="col"></div><div class="row"><button id="rnd">RANDOMIZE</button><button id="ptype" style="background:#555"></button><button id="custBack">DONE</button></div></div></div>
<div class="scr" id="pickS"><h2>Pick your cell</h2><div class="row" id="picks"></div></div>
<div class="scr" id="pauseS"><h2>Paused</h2><button id="resume">RESUME</button><button id="quit" style="background:#555">QUIT</button></div>
<div class="scr" id="dead"><h2 id="dTitle"></h2><div id="dInfo"></div><div class="row"><button id="again">PLAY AGAIN</button><button id="toMenu" style="background:#555">MENU</button></div></div>
<script>
"use strict";
// ============================================================ constants
// Numbers ported from GameView.kt / Cell.kt / CellType.kt / Upgrade.kt.
const W=4500,BOTS=42,PELLETS=420,R0=24,A0=Math.PI*R0*R0,PEL_GAIN=60,SAME=1.15,EAT_OV=.25,ABSORB=.6;
const SPR_COST=100,SPR_INT=.25,SPR_R=10,MAX_TRAIL=250,TRAIL_LIFE=25,TRAIL_FADE=3,SPR_MULT=1.8,AB_CD=10;
const BOT_SPRINT_MARGIN=1.6,BOT_SPRINT_RESERVE=3,BOT_SPEED_RESPONSE=12;
const BUMP_DUR=.35,BUMP_MAX=.22,BUMP_KNOCK=980;
const FLEE_RAYS=24,FLEE_HORIZON=.7,FLEE_COMMIT=.45,FLEE_LEAD=.8,FLEE_TURN=12,CHASE_TURN=10,BOT_TURN=8;
const HUNT_LOCK=.7,HUNT_SWITCH=1.3,FOOD_LOCK=.5,FOOD_SWITCH=1.3;
const BOT_DEF_RANGE=240,BOT_OFF_RANGE=300,BOT_SIPHON_MIN=6,FUNGUS_MULT=2.6;
const SPAWN_IMM=2.5,DEATH_LOCK_MS=600;
const XP_KILL_BASE=10,XP_KILL_AREA_DIV=100;
const COIN_SCORE_PER=5,COIN_PER_KILL=4,COIN_KILL_DIV=10;
const T=[
 {n:'Virus',c:'#e64646',ab:'Siphon',bl:'Absorb all nearby food'},
 {n:'Bacteria',c:'#50c864',ab:'Overdrive',bl:'Burst of extra speed'},
 {n:'Fungus',c:'#4678eb',ab:'Spore Burst',bl:'Slow nearby enemies'},
 {n:'Prion',c:'#b446dc',ab:'Fortify',bl:'Brief invulnerability'},
 {n:'Amoeba',c:'#ff9632',ab:'Lunge',bl:'Dash forward instantly'}];
const beats=(a,b)=>b===(a+1)%5;           // VIRUS>BACTERIA>FUNGUS>PRION>AMOEBA>VIRUS
const rad=c=>Math.sqrt(c.area/Math.PI);
const canEat=(a,b)=>beats(a.t,b.t)||(a.t===b.t&&rad(a)>rad(b)*SAME);
const maxSpeed=c=>320/(1+rad(c)/40)*(c.od>0?1.45:1)*(c.slow>0?.55:1);
const rnd=(a,b)=>a+Math.random()*(b-a), ri=n=>Math.floor(Math.random()*n);
const clampW=(v,r)=>Math.max(r,Math.min(W-r,v));
const wrap=a=>{while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a};
const clamp01=v=>Math.max(0,Math.min(1,v));
const isRealThreat=t=>t.imm<=FLEE_LEAD;
const D=Math.PI/180;

// ============================================================ names (NameGenerator.kt)
const N_FIRST="Luna Max Mia Leo Zoe Finn Ava Kai Nina Theo Ruby Jax Ivy Owen Lola Milo Sara Ezra Tess Hugo Nora Ravi Yuki Omar Elif Sven Maya Diego Aiko Liam Chloe Amir Pablo Hana Oscar Lena Boris Priya Tariq Greta Sam Alex Eli Noor Dani Ben Rosa Jin Anya Cleo Noah Emma Lucas Sofia Ethan Freya Milan Fatima Kenji Zayd Koa Mael Ines Mateo Layla Soren Tara Bodhi Yara Silas Nico Alma Arlo Remi Zion Esme Beau Keanu Calla Dante Suki Logan Zelda Otto Nova Luka Kira Enzo Iris Jaxon".split(' ');
const N_TAGS="Vortex Zenith Cipher Kairo Riven Sol Lyra Zane Echo Rune Orion Nova Nyx Apex Void Rift Vibe Frost Nexus Phantom Spectre Venom Pulse Helix Orbit Drift Blaze Titan Static Mirage Aura Vesper Astro Comet Eclipse Matrix Quantum Sonic Stryker Stealth".split(' ');
const N_ADJ="Sneaky Tiny Angry Hungry Sleepy Lucky Rapid Wobbly Spicy Cosmic Gooey Mighty Silent Crazy Happy Grumpy Fuzzy Toxic Sticky Chunky Dizzy Salty Shiny Brave Lazy Evil Funky Slimy Jolly Atomic Savage Chill Wild Hyper Golden Glitch Mystic Epic Shadow Neon Psycho Frosty Fluffy Rotten Creepy Bouncy Speedy Mega Super Micro".split(' ');
const N_NOUN="Blob Germ Spore Microbe Nugget Goo Cell Amoeba Bug Sludge Pickle Waffle Ninja Wizard Potato Muffin Gremlin Noodle Bean Slayer Dumpling Pirate Shark Yeti Panda Taco Comet Biscuit Viking Goblin Virus Fungi Cilia Nucleus Enzyme Prion Mochi Boba Donut Toast Cookie Sushi Mango Pepper Pancake Pixel Viper Cactus Mantis Falcon".split(' ');
const N_TITLE="Mr Dr Big Lil Capt Sir Chef Agent King Queen Lord Boss Master Uncle Aunt Prof".split(' ');
const N_SUFFIX="_TTV _YT _Pro .gg _vibe _x _god _01 _real _dev _main".split(' ');
const N_MEME="i_eat_microbes just_a_cell dont_eat_me big_chunx smooth_brain gummy_worm noob_master too_slow micro_beast blob_god feed_me_plz mitosis_pro bacteriaboi sir_blobalot hungry_hippo stay_hydrated im_friendly run_for_it eat_my_spores micro_boss blob_builder zero_brain slime_time goo_zilla cell_out spore_loser petri_dish culture_shock giga_blob micro_flex unstable_dna blob_kabob mitosis_go_brr cell_fies bio_hazard super_organism blob_mcblob pico_de_gallo mitosis_god blob_ranger".split(' ');
const pk=a=>a[ri(a.length)];
function nameDigits(){const m=ri(3);return m===0?String(ri(100)).padStart(2,'0'):m===1?'_'+String(ri(100)).padStart(2,'0'):String(1995+ri(28))}
function botName(){
 for(let i=0;i<8;i++){
  const r=ri(100);let n;
  if(r<14)n=pk(N_FIRST);
  else if(r<26)n=pk(N_FIRST)+nameDigits();
  else if(r<34)n=pk(N_FIRST).toLowerCase()+nameDigits();
  else if(r<44)n=pk(N_TAGS);
  else if(r<52)n=pk(N_TAGS)+pk(N_SUFFIX);
  else if(r<64)n=pk(N_ADJ)+pk(N_NOUN);
  else if(r<72)n=pk(N_ADJ)+'_'+pk(N_NOUN);
  else if(r<78)n=pk(N_ADJ)+pk(N_NOUN)+nameDigits();
  else if(r<84)n=pk(N_TITLE)+' '+pk(N_NOUN);
  else if(r<90)n='xX'+pk(N_NOUN)+'Xx';
  else if(r<95)n=pk(N_MEME);
  else n=pk(N_NOUN).toLowerCase()+pk(['lord','king','guy','boi','pro','god','dude']);
  if(n.length<=14)return n;
 }
 return pk(N_FIRST);
}
function sanitizeName(raw){let s=raw.replace(/[\u0000-\u001f\u007f]/g,'').replace(/\s+/g,' ').trim();return s.slice(0,14).replace(/\s+$/,'')}

// ============================================================ looks / cosmetics
const ACCENT=['#ff7060','#ffd040','#6ee6aa','#64beff','#be8cff','#ff82be','#f0f4fa','#282c3c'];
const OUT=[null,'#fff','#ffcd3c','#0f0f14','#5ae6ff','#ff78c8','#aaff50','#bec6d2'];
// LookOption.ALL (Customization.kt). base = number of free options; premium appended after.
const LOOK_OPTS=[
 {key:'eyes',label:'Eyes',names:['None','Dots','Googly','Angry','Sleepy','Happy','Cyclops','Sparkle','Dizzy','Star eyes','Heart eyes','Laser eyes']},
 {key:'mouth',label:'Mouth',names:['None','Smile','Grin','Open','Tongue','Fangs','Smirk','Whistle','Bubblegum']},
 {key:'gear',label:'Face gear',names:['None','Glasses','Shades','Mustache','Blush','Eyepatch','Monocle','Goggles','Beard','Clown nose']},
 {key:'hat',label:'Hat',names:['None','Crown','Party hat','Halo','Horns','Bow','Antenna','Sprout','Bunny ears','Top hat','Wizard hat','Cowboy hat','Viking helmet','Propeller cap','Headphones','Flower']},
 {key:'pat',label:'Pattern',names:['None','Stripes','Polka','Rings','Zigzag','Grid','Hearts','Stars']},
 {key:'out',label:'Outline',names:['Default','White','Gold','Black','Cyan','Pink','Lime','Silver']},
 {key:'acc',label:'Accent',names:['Coral','Sun','Mint','Sky','Lilac','Rose','Snow','Ink']},
 {key:'tone',label:'Tone',names:['Darkest','Darker','Dark','Dim','Normal','Bright','Brighter','Light','Lightest']}
];
const LOOK_BY_KEY=Object.fromEntries(LOOK_OPTS.map(o=>[o.key,o]));
// Cosmetic.kt catalog. opt/key + index within that row.
const COSMETICS=[
 {name:'Wizard Hat',label:'Wizard Hat',blurb:'You shall not pass',price:180,opt:'hat',index:10},
 {name:'Cowboy Hat',label:'Cowboy Hat',blurb:'Yeehaw',price:150,opt:'hat',index:11},
 {name:'Viking Helmet',label:'Viking Helmet',blurb:'To the petri-verse',price:170,opt:'hat',index:12},
 {name:'Propeller Cap',label:'Propeller Cap',blurb:'Big brain energy',price:130,opt:'hat',index:13},
 {name:'Headphones',label:'Headphones',blurb:'In the zone',price:140,opt:'hat',index:14},
 {name:'Flower',label:'Flower',blurb:'Fresh and blooming',price:110,opt:'hat',index:15},
 {name:'Monocle',label:'Monocle',blurb:'How distinguished',price:160,opt:'gear',index:6},
 {name:'Goggles',label:'Goggles',blurb:'Safety first',price:140,opt:'gear',index:7},
 {name:'Beard',label:'Beard',blurb:'Wise and wizened',price:130,opt:'gear',index:8},
 {name:'Clown Nose',label:'Clown Nose',blurb:'Honk',price:120,opt:'gear',index:9},
 {name:'Star Eyes',label:'Star Eyes',blurb:'Dazzling',price:150,opt:'eyes',index:9},
 {name:'Heart Eyes',label:'Heart Eyes',blurb:'Smitten with you',price:150,opt:'eyes',index:10},
 {name:'Laser Eyes',label:'Laser Eyes',blurb:'Pew pew',price:180,opt:'eyes',index:11},
 {name:'Whistle',label:'Whistle',blurb:'Look at me',price:110,opt:'mouth',index:7},
 {name:'Bubblegum',label:'Bubblegum',blurb:'Chewing on it',price:120,opt:'mouth',index:8},
 {name:'Hearts',label:'Hearts',blurb:'Lovely',price:140,opt:'pat',index:6},
 {name:'Stars',label:'Stars',blurb:'Seeing stars',price:140,opt:'pat',index:7}
];
const DAILY_STOCK=8;
const cosmeticFor=(opt,index)=>COSMETICS.find(c=>c.opt===opt&&c.index===index)||null;
const LOOK_COUNT=Object.fromEntries(LOOK_OPTS.map(o=>[o.key,o.names.length]));
const rl=(n,p)=>Math.random()<p?0:1+ri(n-1);
const randLook=()=>({eyes:rl(12,.04),mouth:rl(9,.1),gear:rl(10,.45),hat:rl(16,.35),pat:rl(8,.45),out:OUT[rl(8,.3)],acc:ACCENT[ri(8)],tone:rnd(-1,1)});
// deterministic daily stock (seeded shuffle) -- Java's shuffle can't be matched exactly, but same idea.
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const DAY_MS=86400000;
const dayIndex=ms=>ms<=0?0:Math.floor(ms/DAY_MS);
const msUntilReset=ms=>DAY_MS-(ms%DAY_MS);
function stockForDay(day){const a=COSMETICS.slice(),r=mulberry32(day>>>0);for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));const x=a[i];a[i]=a[j];a[j]=x}return a.slice(0,DAILY_STOCK)}

// ============================================================ state
const cv=document.getElementById('c');let g=cv.getContext('2d');
let VW,VH,DPR;function resize(){DPR=Math.min(2,devicePixelRatio||1);VW=innerWidth;VH=innerHeight;cv.width=VW*DPR;cv.height=VH*DPR;g.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
let state='menu',cells=[],pellets=[],player=null,chosen=0,t=0,trails=0,lb=[],lbRank=0,lbT=0,fx=[],killer=null,peak=0,kills=0,runCoins=0,runKillCoins=0,deadAt=0,levelUpUntil=0;
const store={get(k,d){try{const v=localStorage.getItem('petri_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('petri_'+k,JSON.stringify(v))}catch(e){}}};
let xp=store.get('xp',0),coins=store.get('coins',0),best=store.get('best',0),pname=store.get('name','');
let ownedCos=new Set(store.get('owned',[]));
const xpStep=l=>120+(l-1)*60;
function level(){let l=1,r=xp;while(r>=xpStep(l)){r-=xpStep(l);l++}return{l,into:r,need:xpStep(l)}}
const score=a=>Math.max(0,Math.floor((a-A0)/100));
function mkCell(type,isPlayer){return{x:rnd(100,W-100),y:rnd(100,W-100),area:A0,t:type,player:!!isPlayer,name:'',look:randLook(),vx:0,vy:0,kx:0,ky:0,hd:rnd(0,6.28),alive:true,imm:0,cd:0,od:0,slow:0,boost:false,spT:0,bump:0,bumpAng:0,tgt:null,tgtX:0,tgtY:0,lock:0,wa:rnd(0,6.28),fl:0,fleeAng:0,hunt:null,huntLock:0,aiSeed:ri(1000000),seed:Math.random()*100,aggr:1,caution:1,greed:1,skill:.5,patience:.4,boostiness:1,jit:0,senseT:0,sThreats:[],sPreys:[],sightSq:490000,idleT:0,ease:.7,boostHold:0,boostCd:0}}
// personality + slightly noisy human-ish movement, derived from the bot's aiSeed
function botTraits(c){const s=c.aiSeed|0;
 c.aggr=.75+(s%50)/100;c.caution=.8+((s>>6)%50)/100;c.greed=.7+((s>>12)%60)/100;
 c.skill=.35+((s>>9)%64)/64*.6;c.patience=.15+((s>>17)%50)/50*.75;c.boostiness=.5+((s>>23)%50)/50*.8;
 c.ease=.5+((s>>3)%50)/50*.5;c.jit=0;c.senseT=0;c.sThreats=[];c.sPreys=[];c.sightSq=490000;c.idleT=0;c.boostHold=0;c.boostCd=0}
function placeSafe(c){for(let i=0;i<20;i++){c.x=rnd(100,W-100);c.y=rnd(100,W-100);if(!player||Math.hypot(c.x-player.x,c.y-player.y)>900)break}}
function mkBot(){const r=R0+Math.random()*30;const b=mkCell(ri(5),false);b.area=Math.PI*r*r;b.imm=SPAWN_IMM;b.name=uniqueBotName();b.look=uniqueBotLook();b.wa=rnd(0,6.28);placeSafe(b);botTraits(b);return b}
function newPellet(p){p=p||{};p.x=rnd(30,W-30);p.y=rnd(30,W-30);p.col=`hsl(${ri(360)},80%,62%)`;p.trail=false;p.gone=false;return p}
function startGame(type){
 chosen=type;bankedRun=0;parts=[];feed=[];cells=[];pellets=[];trails=0;fx=[];peak=0;kills=0;runCoins=0;runKillCoins=0;killer=null;
 player=mkCell(type,true);player.name=pname||'Player';player.look=toLook(cz);player.imm=shieldT();player.x=W/2;player.y=W/2;cells.push(player);
 for(let i=0;i<BOTS;i++)cells.push(mkBot());
 for(let i=0;i<PELLETS;i++)pellets.push(newPellet());
 setState('play')}
function setState(s){state=s;for(const id of['menu','shopS','custS','pickS','pauseS','dead','cosS'])document.getElementById(id).classList.remove('on');
 const m={menu:'menu',shop:'shopS',cust:'custS',pick:'pickS',pause:'pauseS',dead:'dead',cos:'cosS'}[s];if(m)document.getElementById(m).classList.add('on');
 document.getElementById('pauseBtn').style.display=s==='play'?'block':'none';if(s==='menu')refreshStats();syncMute()}
function refreshStats(){const L=level();document.getElementById('stats').textContent=`Level ${L.l} (${L.into}/${L.need} XP) · ${coins} Biocoins · Best size ${best} · build 6`}
// ---- unique names / looks
function nameInUse(n){for(const c of cells)if(c.name&&c.name.toLowerCase()===n.toLowerCase())return true;return false}
function uniqueBotName(){let n=botName(),i=0;while(i<6&&nameInUse(n)){n=botName();i++}return n}
function sameLook(a,b){return a&&b&&a.eyes===b.eyes&&a.mouth===b.mouth&&a.gear===b.gear&&a.hat===b.hat&&a.pat===b.pat&&a.out===b.out&&a.acc===b.acc}
function lookInUse(l){for(const c of cells)if(sameLook(c.look,l))return true;return false}
function uniqueBotLook(){let l,i=0;do{l=randLook();i++}while(i<12&&lookInUse(l));return l}

// ============================================================ input
const keys={};let mx=0,my=0,mouseOn=false,joy=null,boostH=false,abReq=false,touchUI=false;
function audioGesture(){AudioSys.resume();AudioSys.applyState()}
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;audioGesture();keys[e.code]=true;
 if(e.code==='Space'){boostH=true;e.preventDefault()}
 if(e.code==='KeyE'||e.code==='ShiftLeft'||e.code==='ShiftRight')abReq=true;
 if(e.code==='Escape'||e.code==='KeyP'){if(state==='play')pause();else if(state==='pause')setState('play')}});
addEventListener('keyup',e=>{keys[e.code]=false;if(e.code==='Space')boostH=false});
addEventListener('pointerdown',e=>{audioGesture();if(e.pointerType==='touch'){touchUI=true;mouseOn=false}},true);
addEventListener('mousemove',e=>{if(touchUI)return;mouseOn=true;mx=e.clientX-VW/2;my=e.clientY-VH/2});
addEventListener('mousedown',e=>{if(e.target===cv&&state==='play'&&e.button===2)abReq=true});
addEventListener('contextmenu',e=>e.preventDefault());
const btn={boost:{x:0,y:0,r:46},ab:{x:0,y:0,r:38}};
function layoutBtns(){btn.boost.x=VW-90;btn.boost.y=VH-90;btn.ab.x=VW-190;btn.ab.y=VH-70}
cv.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch')return;touchUI=true;layoutBtns();cv.setPointerCapture(e.pointerId);
 const hit=b=>Math.hypot(e.clientX-b.x,e.clientY-b.y)<b.r+10;

 g.textAlign='right';g.font='700 14px system-ui';feed.forEach((f,i)=>{g.globalAlpha=Math.min(1,f.t);g.fillStyle='#ffd040';g.fillText(f.txt,VW-14,70+lb.length*22+i*20)});g.globalAlpha=1;
 const T0=T[player.t];g.textAlign='center';
 if(!touchUI){g.font='700 16px system-ui';g.fillStyle=player.cd>0?'#aaa':'#fff';g.fillText(`[E] ${T0.ab}${player.cd>0?` ${Math.ceil(player.cd)}s`:' ready'}   ·   [Space] Boost`,VW/2,VH-20)}
 else{layoutBtns();for(const[b,l,on]of[[btn.boost,'BOOST',boostH],[btn.ab,T0.ab,player.cd<=0]]){g.fillStyle=on?T0.c:'#444';g.globalAlpha=.7;g.beginPath();g.arc(b.x,b.y,b.r,0,6.3);g.fill();g.globalAlpha=1;g.fillStyle='#fff';g.font='700 12px system-ui';g.fillText(l,b.x,b.y+4)}
  if(player.cd>0)g.fillText(Math.ceil(player.cd),btn.ab.x,btn.ab.y+18);
  if(joy){g.strokeStyle='#fff6';g.lineWidth=3;g.beginPath();g.arc(joy.ox,joy.oy,60,0,6.3);g.stroke();g.fillStyle='#fff8';g.beginPath();g.arc(joy.ox+joy.dx*60,joy.oy+joy.dy*60,26,0,6.3);g.fill()}}}

// ============================================================ audio (procedural; original used res/raw assets)
const AudioSys=(()=>{let ctx=null,enabled=store.get('snd',true),musicTimer=null,musicGain=null,mode=null,step=0;
 const MENU=[261.63,329.63,392.00,329.63,293.66,349.23,440.00,349.23];
 const GAME=[220.00,261.63,329.63,392.00,329.63,261.63,246.94,293.66];
 function ac(){if(!ctx){try{ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){ctx=null}}return ctx}
 function note(freq,dur,type,vol,slide){const c=ac();if(!c||!enabled)return;const o=c.createOscillator(),gn=c.createGain();o.type=type||'sine';o.frequency.setValueAtTime(freq,c.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,freq*slide),c.currentTime+dur);gn.gain.setValueAtTime(0.0001,c.currentTime);gn.gain.exponentialRampToValueAtTime(vol,c.currentTime+0.012);gn.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+dur);o.connect(gn).connect(c.destination);o.start();o.stop(c.currentTime+dur+0.02)}
 function tick(){if(!enabled||!ctx){return}const seq=mode==='game'?GAME:MENU;note(seq[step%seq.length],.5,'triangle',mode==='game'?.05:.035);step++}
 function startMusic(){if(musicTimer)return;step=0;tick();musicTimer=setInterval(tick,430)}
 function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null}}
 return{
  resume(){const c=ac();if(c&&c.state==='suspended')c.resume().catch(()=>{})},
  applyState(){if(!enabled){stopMusic();mode=null;return}const m=(state==='play'||state==='pause')?'game':'menu';if(m!==mode){mode=m;stopMusic();startMusic()}},
  setEnabled(v){enabled=v;store.set('snd',v);this.resume();this.applyState()},
  isEnabled(){return enabled},
  pellet(){note(rnd(720,940),.06,'square',.05,.85)},
  power(){note(520,.18,'sine',.09,1.9)},
  eat(){note(rnd(500,640),.07,'triangle',.06,1.2)},
  kill(){note(170,.22,'sawtooth',.11,.5)},
  death(){note(140,.6,'sawtooth',.13,.35)} };
})();

// ============================================================ main loop
refreshStats();syncMute();
let lastFrame=performance.now();
function frame(now){
 let dt=(now-lastFrame)/1000;lastFrame=now;if(dt>.05)dt=.05;if(dt<0)dt=0;
 if(state==='play'&&player)update(dt);
 draw();
 if(state==='cust')drawPreview(now);
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
