<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="theme-color" content="#0b1020"><meta name="apple-mobile-web-app-title" content="Petri.IO"><title>Petri.IO</title>
<style>
html,body{margin:0;height:100%;background:#0b1020;overflow:hidden;font-family:system-ui,sans-serif;color:#fff;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(8,12,28,.72);text-align:center}
.scr.on{display:flex}
h1{font-size:64px;margin:0;letter-spacing:2px}
button,input{font:inherit;border:0;border-radius:12px;padding:12px 26px;font-weight:700}
button{cursor:pointer;color:#fff;background:#3b82f6;font-size:20px}button:hover{filter:brightness(1.15)}
input{background:#1b2440;color:#fff;text-align:center;width:200px}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.pick{width:150px;padding:14px 8px;font-size:18px}.pick small{display:block;font-weight:400;font-size:12px;margin-top:4px}
.dim{opacity:.7;font-size:14px}
#custS.on{flex-direction:row;flex-wrap:wrap;gap:24px 36px}.col{display:flex;flex-direction:column;gap:8px;align-items:center}.col h2{margin:0}
.crow{display:flex;align-items:center;gap:8px;width:290px}.crow span{flex:1;font-weight:700}.crow button{padding:4px 14px;font-size:18px}
#custS .row button{padding:8px 16px;font-size:16px}
#shopS{justify-content:flex-start;overflow:auto;padding:14px 0;gap:8px}#shopS h2,#shopS .dim{margin:0}
#urows{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:8px;width:min(680px,94vw)}
.urow{display:flex;align-items:center;gap:10px;background:#1b2440;border-radius:12px;padding:8px 12px;text-align:left}.urow div{flex:1}.urow small{display:block;opacity:.7;font-size:12px}.urow button{padding:6px 12px;font-size:15px;min-width:74px}
#rows{gap:4px}.crow button{padding:2px 12px;font-size:16px}
@media(max-height:520px){#custS.on{align-items:flex-start;overflow:auto;padding:8px}}
#pauseBtn{position:fixed;top:8px;left:50%;transform:translateX(-50%);padding:4px 14px;font-size:14px;background:#0008;display:none}
</style></head><body>
<canvas id="c"></canvas>
<button id="pauseBtn">❚❚</button>
<div class="scr on" id="menu"><h1>Petri.IO</h1>
 <div class="dim">Type beats type. Size only matters against your own kind.</div>
 <input id="name" maxlength="14" placeholder="Your name">
 <div class="row"><button id="play">PLAY</button><button id="custBtn" style="background:#8b5cf6">CUSTOMIZE</button><button id="shopBtn" style="background:#d97706">SHOP</button></div>
 <div class="dim" id="stats"></div>
 <div class="dim">Mouse/touch-stick or WASD to steer · Space = boost · E/Shift = ability · Esc = pause</div></div>
<div class="scr" id="shopS"><h2>Upgrade Shop</h2><div id="shopInfo" style="font-weight:700;color:#5ae682"></div><div class="dim" id="shopMsg">&nbsp;</div><div id="urows"></div><button id="shopBack">BACK</button></div>
<div class="scr" id="custS"><canvas id="prev" width="190" height="190" style="position:static;width:190px;height:190px;background:#10172e;border-radius:16px"></canvas><div class="col"><h2>Customize</h2><div id="rows" class="col"></div><div class="row"><button id="rnd">RANDOMIZE</button><button id="ptype" style="background:#555"></button><button id="custBack">DONE</button></div></div></div>
<div class="scr" id="pickS"><h2>Pick your cell</h2><div class="row" id="picks"></div></div>
<div class="scr" id="pauseS"><h2>Paused</h2><button id="resume">RESUME</button><button id="quit" style="background:#555">QUIT</button></div>
<div class="scr" id="dead"><h2 id="dTitle"></h2><div id="dInfo"></div><div class="row"><button id="again">PLAY AGAIN</button><button id="toMenu" style="background:#555">MENU</button></div></div>
<script>
"use strict";
// ---------- constants (ported from GameView.kt) ----------
const W=4500,BOTS=42,PELLETS=420,R0=24,A0=Math.PI*R0*R0,PEL_GAIN=60,SAME=1.15,EAT_OV=.25,ABSORB=.6;
const SPR_COST=100,SPR_INT=.25,SPR_R=10,MAX_TRAIL=250,TRAIL_LIFE=25,SPR_MULT=1.8,AB_CD=10;
const T=[
 {n:'Virus',c:'#e64646',ab:'Siphon',bl:'Absorb all nearby food'},
 {n:'Bacteria',c:'#50c864',ab:'Overdrive',bl:'Burst of extra speed'},
 {n:'Fungus',c:'#4678eb',ab:'Spore Burst',bl:'Slow nearby enemies'},
 {n:'Prion',c:'#b446dc',ab:'Fortify',bl:'Brief invulnerability'},
 {n:'Amoeba',c:'#ff9632',ab:'Lunge',bl:'Dash forward instantly'}];
const beats=(a,b)=>b===(a+1)%5;           // VIRUS>BACTERIA>FUNGUS>PRION>AMOEBA>VIRUS
const rad=c=>Math.sqrt(c.area/Math.PI);
const canEat=(a,b)=>beats(a.t,b.t)||(a.t===b.t&&rad(a)>rad(b)*SAME);
const maxSpeed=c=>320/(1+rad(c)/40)*(c.od>0?1.45:1)*(c.slow>0?.55:1);
const rnd=(a,b)=>a+Math.random()*(b-a), ri=n=>Math.floor(Math.random()*n);
const clampW=(v,r)=>Math.max(r,Math.min(W-r,v));
const wrap=a=>{while(a>Math.PI)a-=2*Math.PI;while(a<-Math.PI)a+=2*Math.PI;return a};
// ---------- names ----------
const FIRST="Luna Max Mia Leo Zoe Finn Ava Kai Nina Theo Ruby Jax Ivy Owen Lola Milo Sara Ezra Hugo Nora Yuki Omar Maya Diego".split(' ');
const TAGS="Vortex Zenith Cipher Riven Echo Rune Orion Nova Nyx Apex Void Rift Frost Nexus Phantom Pulse Helix Blaze Titan".split(' ');
const ADJ="Sneaky Tiny Angry Hungry Sleepy Lucky Wobbly Spicy Cosmic Gooey Mighty Silent Crazy Happy Grumpy Fuzzy Toxic Chunky".split(' ');
const NOUN="Blob Germ Spore Microbe Nugget Goo Cell Amoeba Bug Sludge Pickle Waffle Ninja Wizard Potato Muffin Noodle Taco".split(' ');
const MEME="i_eat_microbes just_a_cell dont_eat_me big_chunx gummy_worm noob_master too_slow blob_god feed_me_plz mitosis_pro petri_dish bio_hazard blob_mcblob".split(' ');
const pk=a=>a[ri(a.length)], dg=()=>[String(ri(100)).padStart(2,'0'),'_'+String(ri(100)).padStart(2,'0'),String(1995+ri(28))][ri(3)];
function botName(){for(let i=0;i<8;i++){const r=ri(100);const n=r<20?pk(FIRST):r<35?pk(FIRST)+dg():r<50?pk(TAGS):r<58?pk(TAGS)+pk(['_TTV','_YT','_Pro','.gg']):r<75?pk(ADJ)+pk(NOUN):r<85?pk(ADJ)+pk(NOUN)+dg():r<92?'xX'+pk(NOUN)+'Xx':pk(MEME);if(n.length<=14)return n}return pk(FIRST)}
// ---------- looks ----------
const ACC=['#ff7060','#ffd040','#6ee6aa','#64beff','#be8cff','#ff82be','#f0f4fa','#282c3c'];
const OUT=[null,'#fff','#ffcd3c','#0f0f14','#5ae6ff','#ff78c8','#aaff50','#bec6d2'];
const rl=(n,p)=>Math.random()<p?0:1+ri(n-1);
const randLook=()=>({eyes:rl(9,.04),mouth:rl(7,.1),gear:rl(6,.45),hat:rl(10,.35),pat:rl(6,.45),out:OUT[rl(8,.3)],acc:ACC[ri(8)],tone:rnd(-1,1)});
// ---------- state ----------
const cv=document.getElementById('c');let g=cv.getContext('2d');
let VW,VH,DPR;function resize(){DPR=Math.min(2,devicePixelRatio||1);VW=innerWidth;VH=innerHeight;cv.width=VW*DPR;cv.height=VH*DPR;g.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
let state='menu',cells=[],pellets=[],player=null,chosen=0,t=0,trails=0,lb=[],lbT=0,fx=[],killer=null,peak=0,kills=0,runCoins=0;
const store={get(k,d){try{const v=localStorage.getItem('petri_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('petri_'+k,JSON.stringify(v))}catch(e){}}};
let xp=store.get('xp',0),coins=store.get('coins',0),best=store.get('best',0),pname=store.get('name','');
const xpStep=l=>120+(l-1)*60;
function level(){let l=1,r=xp;while(r>=xpStep(l)){r-=xpStep(l);l++}return{l,into:r,need:xpStep(l)}}
const score=a=>Math.max(0,Math.floor((a-A0)/100));
function mkCell(t,player){return{x:rnd(100,W-100),y:rnd(100,W-100),area:A0,t,player,name:'',look:randLook(),vx:0,vy:0,kx:0,ky:0,hd:rnd(0,6.28),alive:true,imm:0,cd:0,od:0,slow:0,boost:false,spT:0,ft:0,fl:0,lock:0,tgt:null,wa:rnd(0,6.28),seed:Math.random()*100}}
function placeSafe(c){for(let i=0;i<20;i++){c.x=rnd(100,W-100);c.y=rnd(100,W-100);if(!player||Math.hypot(c.x-player.x,c.y-player.y)>900)break}}
function newPellet(p){p=p||{};p.x=rnd(30,W-30);p.y=rnd(30,W-30);p.col=`hsl(${ri(360)},80%,62%)`;p.trail=false;return p}
function startGame(type){
 chosen=type;bankedRun=0;parts=[];feed=[];cells=[];pellets=[];trails=0;fx=[];peak=0;kills=0;runCoins=0;killer=null;
 player=mkCell(type,true);player.name=pname||'Player';player.look=toLook(cz);player.imm=shieldT();player.x=player.y=W/2+rnd(-500,500);cells.push(player);
 for(let i=0;i<BOTS;i++){const b=mkCell(ri(5),false);b.name=botName();placeSafe(b);cells.push(b)}
 for(let i=0;i<PELLETS;i++)pellets.push(newPellet());
 setState('play')}
function setState(s){state=s;for(const id of['menu','shopS','custS','pickS','pauseS','dead'])document.getElementById(id).classList.remove('on');
 const m={menu:'menu',shop:'shopS',cust:'custS',pick:'pickS',pause:'pauseS',dead:'dead'}[s];if(m)document.getElementById(m).classList.add('on');
 document.getElementById('pauseBtn').style.display=s==='play'?'block':'none';if(s==='menu')refreshStats()}
function refreshStats(){const L=level();document.getElementById('stats').textContent=`Level ${L.l} (${L.into}/${L.need} XP) · ${coins} Biocoins · Best size ${best} · build 4`}
// ---------- input ----------
const keys={};let mx=0,my=0,mouseOn=false,joy=null,boostH=false,abReq=false,touchUI=false;
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;keys[e.code]=true;
 if(e.code==='Space'){boostH=true;e.preventDefault()}
 if(e.code==='KeyE'||e.code==='ShiftLeft'||e.code==='ShiftRight')abReq=true;
 if(e.code==='Escape'||e.code==='KeyP'){if(state==='play')pause();else if(state==='pause')setState('play')}});
addEventListener('keyup',e=>{keys[e.code]=false;if(e.code==='Space')boostH=false});
addEventListener('pointerdown',e=>{if(e.pointerType==='touch'){touchUI=true;mouseOn=false}},true);
addEventListener('mousemove',e=>{if(touchUI)return;mouseOn=true;mx=e.clientX-VW/2;my=e.clientY-VH/2});
addEventListener('mousedown',e=>{if(e.target===cv&&state==='play'&&e.button===2)abReq=true});
addEventListener('contextmenu',e=>e.preventDefault());
const btn={boost:{x:0,y:0,r:46},ab:{x:0,y:0,r:38}};
function layoutBtns(){btn.boost.x=VW-90;btn.boost.y=VH-90;btn.ab.x=VW-190;btn.ab.y=VH-70}
cv.addEventListener('pointerdown',e=>{if(e.pointerType!=='touch')return;touchUI=true;layoutBtns();cv.setPointerCapture(e.pointerId);
 const hit=b=>Math.hypot(e.clientX-b.x,e.clientY-b.y)<b.r+10;
 if(hit(btn.boost))btn.boost.id=e.pointerId,boostH=true;
 else if(hit(btn.ab))abReq=true;
 else if(!joy)joy={id:e.pointerId,ox:e.clientX,oy:e.clientY,dx:0,dy:0}});
cv.addEventListener('pointermove',e=>{if(joy&&joy.id===e.pointerId){let dx=e.clientX-joy.ox,dy=e.clientY-joy.oy;const d=Math.hypot(dx,dy),m=60;if(d>m){dx*=m/d;dy*=m/d}joy.dx=dx/m;joy.dy=dy/m}});
const up=e=>{if(joy&&joy.id===e.pointerId)joy=null;if(btn.boost.id===e.pointerId){boostH=false;btn.boost.id=null}};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
function inputDir(){let x=0,y=0;
 if(keys.KeyA||keys.ArrowLeft)x--;if(keys.KeyD||keys.ArrowRight)x++;if(keys.KeyW||keys.ArrowUp)y--;if(keys.KeyS||keys.ArrowDown)y++;
 if(x||y){const d=Math.hypot(x,y);return[x/d,y/d,1]}
 if(joy){const m=Math.hypot(joy.dx,joy.dy);return m<.08?[0,0,0]:[joy.dx/m,joy.dy/m,Math.min(1,m)]}
 if(mouseOn&&!touchUI){const d=Math.hypot(mx,my);return d<12?[0,0,0]:[mx/d,my/d,Math.min(1,d/120)]}
 return[0,0,0]}
function pause(){state='pause';boostH=false;bank();setState('pause')}
// ---------- UI buttons ----------
const $=id=>document.getElementById(id);
$('name').value=pname;
$('play').onclick=()=>{pname=$('name').value.replace(/\s+/g,' ').trim().slice(0,14);store.set('name',pname);setState('pick')};
$('resume').onclick=()=>setState('play');
$('quit').onclick=()=>{bank();setState('menu')};
$('again').onclick=()=>setState('pick');$('toMenu').onclick=()=>setState('menu');
$('pauseBtn').onclick=pause;
for(let i=0;i<5;i++){const b=document.createElement('button');b.className='pick';b.style.background=T[i].c;
 b.innerHTML=`${T[i].n}<small>${T[i].ab}: ${T[i].bl}</small><small>Eats ${T[(i+1)%5].n}<br>Eaten by ${T[(i+4)%5].n}</small>`;b.onclick=()=>startGame(i);$('picks').appendChild(b)}
// ---------- juice ----------
let parts=[],feed=[];
function burst(x,y,col,n){for(let i=0;i<n;i++){const a=rnd(0,6.28),sp=rnd(40,170);parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:rnd(.3,.6),col})}}
function pop(x,y,txt){parts.push({x,y,vx:0,vy:-45,l:1.1,txt,col:'#fff'})}
// ---------- upgrades (numbers from Upgrade.kt / GameView.kt) ----------
// Each upgrade unlocks at its own account level, worst -> best, 10 levels apart (set the numbers to 1 to test).
// Saves are stored by the index in UP below, so don't reorder UP itself; the shop order comes from the unlock level.
const BIO='#5ae682'; // Biocoin green
const UP=[['Speed','+10% move speed per level',18,40],['Point Gain','+20% size from food and kills',25,50],['Sprint Power','+14% boost speed per level',20,30],['Spawn Shield','+1.0s spawn immunity per level',15,10],['Food Reach','+14% food pickup range per level',20,20]];
const UP_ORDER=UP.map((_,i)=>i).sort((a,b)=>UP[a][3]-UP[b][3]); // shop display order: Shield, Reach, Sprint, Speed, Point Gain
const SHOP_UNLOCK=Math.min(...UP.map(u=>u[3]));
const UP_MAX=5;let upLv=store.get('up',[0,0,0,0,0]);if(!Array.isArray(upLv)||upLv.length!==5)upLv=[0,0,0,0,0];upLv=upLv.map(v=>Math.max(0,Math.min(UP_MAX,v|0)));
const speedM=()=>1+.10*upLv[0],gainM=()=>1+.20*upLv[1],sprM=()=>SPR_MULT+.14*upLv[2],shieldT=()=>2.5+1.0*upLv[3],reachM=()=>1+.14*upLv[4];
const upCost=(i,l)=>Math.ceil(UP[i][2]*Math.pow(1.75,l));
function renderShop(msg){const L=level();
 $('shopInfo').textContent=`⬤ ${coins} Biocoins · Level ${L.l}`+(L.l<SHOP_UNLOCK?` · 🔒 upgrades start at Level ${SHOP_UNLOCK}`:'');
 if(msg!=null)$('shopMsg').textContent=msg;
 const box=$('urows');box.innerHTML='';
 UP_ORDER.forEach(i=>{const [n,bl,,ul]=UP[i],l=upLv[i],open=L.l>=ul,d=document.createElement('div');d.className='urow';if(!open)d.style.opacity='.55';
  d.innerHTML=`<div><b>${n}</b> <span style="color:#ffd040">${'●'.repeat(l)}${'○'.repeat(UP_MAX-l)}</span><small>${bl}</small></div>`;
  const b=document.createElement('button');b.textContent=!open?`🔒 LV ${ul}`:l>=UP_MAX?'MAX':`⬤ ${upCost(i,l)}`;b.style.background=!open||l>=UP_MAX?'#555':'#16a34a';b.onclick=()=>buy(i);d.appendChild(b);box.appendChild(d)})}
function buy(i){const L=level();
 if(L.l<UP[i][3])return renderShop(`${UP[i][0]} unlocks at Level ${UP[i][3]}`);
 const l=upLv[i];if(l>=UP_MAX)return renderShop(`${UP[i][0]} is already maxed`);
 const c=upCost(i,l);if(coins<c)return renderShop(`Need ${c-coins} more Biocoins`);
 coins-=c;upLv[i]=l+1;store.set('coins',coins);store.set('up',upLv);renderShop(`${UP[i][0]} upgraded!`)}
$('shopBtn').onclick=()=>{renderShop('\u00a0');setState('shop')};
$('shopBack').onclick=()=>setState('menu');
// ---------- customization ----------
const ROWS=[['Eyes',['None','Dots','Googly','Angry','Sleepy','Happy','Cyclops','Sparkle','Dizzy'],'eyes'],['Mouth',['None','Smile','Grin','Open','Tongue','Fangs','Smirk'],'mouth'],
 ['Hat',['None','Crown','Party hat','Halo','Horns','Bow','Antenna','Sprout','Bunny ears','Top hat'],'hat'],['Gear',['None','Glasses','Shades','Mustache','Blush','Eyepatch'],'gear'],['Pattern',['None','Stripes','Polka','Rings','Zigzag','Grid'],'pat'],
 ['Accent',['Coral','Sun','Mint','Sky','Lilac','Rose','Snow','Ink'],'acc'],['Tone',['Darkest','Darker','Dark','Dim','Normal','Bright','Brighter','Light','Lightest'],'tone']];
let cz=Object.assign({eyes:1,mouth:1,hat:0,gear:0,pat:0,out:0,acc:0,tone:4},store.get('look',{})),pvType=0;
for(const[,n,k]of ROWS)cz[k]=Math.max(0,Math.min(n.length-1,cz[k]|0));
const toLook=z=>({eyes:z.eyes,mouth:z.mouth,hat:z.hat,acc:ACC[z.acc],out:OUT[z.out],tone:(z.tone-4)/4,gear:z.gear,pat:z.pat});
const spans={};
for(const[l,n,k]of ROWS){const d=document.createElement('div');d.className='crow';
 const mk=(txt,dir)=>{const b=document.createElement('button');b.textContent=txt;b.onclick=()=>{cz[k]=(cz[k]+dir+n.length)%n.length;store.set('look',cz);updCz()};return b};
 spans[k]=document.createElement('span');d.append(mk('◀',-1),spans[k],mk('▶',1));$('rows').appendChild(d)}
function updCz(){for(const[l,n,k]of ROWS)spans[k].textContent=l+': '+n[cz[k]];$('ptype').textContent='Preview: '+T[pvType].n}
$('custBtn').onclick=()=>{pvType=chosen;updCz();setState('cust')};
$('custBack').onclick=()=>setState('menu');
$('ptype').onclick=()=>{pvType=(pvType+1)%5;updCz()};
$('rnd').onclick=()=>{for(const[,n,k]of ROWS)cz[k]=ri(n.length);if(!cz.eyes)cz.eyes=1+ri(4);store.set('look',cz);updCz()};
function drawPreview(now){const pc=$('prev'),pg=pc.getContext('2d');pg.setTransform(1,0,0,1,0,0);pg.clearRect(0,0,pc.width,pc.height);
 const og=g,ot=t;g=pg;t=now/1000;g.translate(pc.width/2,pc.height/2+8);
 drawCell({x:0,y:0,area:Math.PI*46*46,t:pvType,look:toLook(cz),hd:Math.sin(t*.8)*.6,imm:0,seed:1,name:'',player:true,pv:true,vx:0,vy:0});g=og;t=ot}
let banked=false;function bank(){if(banked)return;const c=runCoins-bankedRun;if(c>0){coins+=c;store.set('coins',coins);bankedRun=runCoins}if(peak>best){best=peak;store.set('best',best)}store.set('xp',xp)}
let bankedRun=0;
// ---------- abilities ----------
function activate(c,ang){if(c.cd>0)return false;c.cd=AB_CD;const r=rad(c);let ringR=0;
 if(c.t===0){ringR=400+2*r;const rr=ringR*ringR;for(let i=pellets.length-1;i>=0;i--){const p=pellets[i];if((p.x-c.x)**2+(p.y-c.y)**2<rr&&p.by!==c){c.area+=gain(c,p);if(p.trail){pellets.splice(i,1);trails--}else newPellet(p)}}}
 else if(c.t===1){c.od=3;ringR=r*1.6}
 else if(c.t===2){ringR=r*2.6;for(const o of cells)if(o!==c&&o.alive&&Math.hypot(o.x-c.x,o.y-c.y)<ringR+rad(o))o.slow=3}
 else if(c.t===3){c.imm=Math.max(c.imm,2.5);ringR=r*1.5}
 else{c.kx+=Math.cos(ang)*900;c.ky+=Math.sin(ang)*900;ringR=r*1.4}
 fx.push({x:c.x,y:c.y,r:ringR,col:T[c.t].c,t:0});return true}
const gain=(c,p)=>(p.trail?p.value:PEL_GAIN)*(c.player?gainM():1);
// ---------- sprint ----------
const sprintFloor=c=>A0*(c.player?1.2:1.6)+SPR_COST*3;
function updateSprint(dt){for(const c of cells){
 if(c.boost&&c.area>sprintFloor(c)){c.spT-=dt;if(c.spT<=0){c.spT=SPR_INT;c.area-=SPR_COST;
  if(trails>=MAX_TRAIL){const i=pellets.findIndex(p=>p.trail);if(i>=0){pellets.splice(i,1);trails--}}
  const a=c.hd+Math.PI,r=rad(c);pellets.push({x:c.x+Math.cos(a)*r,y:c.y+Math.sin(a)*r,trail:true,value:SPR_COST,life:TRAIL_LIFE,by:c,col:T[c.t].c});trails++}}
 else c.boost=false}

// ---------- bots ----------
